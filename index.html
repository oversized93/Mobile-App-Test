<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Tycoon">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="theme-color" content="#1a472a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Golf Tycoon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a472a;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,sans-serif}
#container{position:relative;width:100%;height:100%}
#three-canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
#c{position:absolute;top:0;left:0;width:100%;height:100%}

/* Rotate-to-landscape overlay. Shown only when viewport is taller than wide. */
#rotate-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(180deg,#0b2a1c 0%,#144f33 50%,#08170f 100%);
  color:#fff;text-align:center;z-index:1000;padding:24px;
}
@media (orientation: portrait){ #rotate-overlay{display:flex} }
#rotate-overlay .icon{
  font-size:64px;margin-bottom:16px;
  animation:rotateHint 2s ease-in-out infinite;
}
#rotate-overlay h1{font-size:22px;font-weight:800;margin-bottom:8px}
#rotate-overlay p{font-size:14px;opacity:.7;max-width:280px;line-height:1.5}
@keyframes rotateHint{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(90deg)}
}
#rotate-overlay .tips{margin-top:14px;font-size:12px;opacity:.55;max-width:300px;line-height:1.5}
#rotate-overlay button{
  margin-top:18px;padding:10px 22px;border:0;border-radius:22px;
  background:rgba(255,255,255,.15);color:#fff;font-size:14px;font-weight:600;
}
</style>
</head>
<body>
<div id="container">
<canvas id="three-canvas"></canvas>
<canvas id="c"></canvas>
</div>
<div id="rotate-overlay">
  <div class="icon">&#x1F4F1;</div>
  <h1>Please rotate your device</h1>
  <p>Golf Tycoon is designed for landscape. Turn your phone sideways to start playing.</p>
  <p class="tips">Nothing happening? Check that orientation lock is off
  (Control Center), and open this page in Safari &mdash; in-app browsers
  often can't rotate.</p>
  <button id="rotate-continue">Continue anyway</button>
</div>
<script>
  // Best-effort orientation lock — browsers ignore this unless fullscreen,
  // which is why we also show the rotate-overlay via CSS.
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  // Escape hatch: orientation-locked devices and in-app browsers can never
  // reach landscape, so the overlay must be dismissible. Inline style wins
  // over the CSS media query.
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('rotate-continue');
    if (btn) btn.addEventListener('click', () => {
      document.getElementById('rotate-overlay').style.display = 'none';
    });
  });
</script>
<script src="lib/three.min.js?v=g2b"></script>
<script src="lib/GLTFLoader.js?v=g2b"></script>
<script src="engine.js?v=g2b"></script>
<script src="courses.js?v=g2b"></script>
<script src="builder.js?v=g2b"></script>
<script src="renderer3d.js?v=g2b"></script>
<script src="game.js?v=g2b"></script>
</body>
</html>
